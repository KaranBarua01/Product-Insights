name: Original Taxonomy Viewer QA
on:
  push:
    branches:
      - feat/full-taxonomy-explorer-target
      - feat/operator-approved-any-company-tests
      - feat/adaptive-evidence-research-v2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  taxonomy-and-dashboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Live Lab dependencies
        working-directory: live-lab
        run: npm install --no-audit --no-fund
      - name: Test full reference, protected sync and UI
        working-directory: live-lab
        run: npm run check
      - name: Bundle Cloudflare Worker without deployment
        if: matrix.os == 'ubuntu-latest'
        working-directory: live-lab
        run: npm run build:check
      - name: Install and compile improved Scrappers engine
        working-directory: Scrappers
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Validate all local relationship and bridge JavaScript
        working-directory: Scrappers
        run: |
          node --check tools/research-lab.mjs
          node --check tools/live-lab-bridge.mjs
          node --check tools/oem-process-reference.mjs
          node --check tools/research-relationship-graph.mjs
          node --check tools/research-edition-store.mjs
          node --check tools/ollama-relationships.mjs
          node --check tools/approved-company-sites.mjs
          node --check tools/approve-company.mjs
          node --check tools/test-diverse-company-websites.mjs
          node --check tools/adaptive-research-v2.mjs
          node --check tools/product-evidence-v2.mjs
      - name: Test OEM foundation and arbitrary public company approval/benchmarks
        working-directory: Scrappers
        run: node --test tests/oem-foundation.test.mjs tests/any-company-benchmark.test.mjs tests/cross-industry-navigation.test.mjs tests/adaptive-research-v2.test.mjs tests/adaptive-html.test.mjs tests/product-intelligence.test.mjs tests/ollama-known-products.test.mjs tests/research-lab.test.mjs
