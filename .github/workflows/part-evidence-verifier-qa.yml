name: Part Evidence Verifier V1 (no deployment)
on:
  push:
    branches: [feat/part-evidence-verifier-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Scrappers
        working-directory: Scrappers
        run: npm install --omit=optional --no-audit --no-fund
      - name: Build and focused evidence regression suite
        working-directory: Scrappers
        run: |
          npm run build
          node --test tests/part-evidence-verifier.test.mjs tests/oem-foundation.test.mjs tests/product-intelligence.test.mjs tests/independent-qa.test.mjs tests/adaptive-research-v2.test.mjs tests/research-intelligence.test.mjs
      - name: Ensure no production D1 data or original taxonomy is needed
        working-directory: Scrappers
        run: |
          node --test tests/part-evidence-verifier.test.mjs
          test ! -f local-data/d1-company-context.json
