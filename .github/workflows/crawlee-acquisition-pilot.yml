name: Crawlee A/B Product Insights Acquisition Pilot (no deployment)
on:
  push:
    branches: [experiment/crawlee-acquisition-pilot-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        site: [bike, polymer, reseller]
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project and official pinned Crawlee release
        working-directory: Scrappers
        run: |
          npm install --omit=optional --no-audit --no-fund
          npm install --no-save --no-package-lock --no-audit --no-fund crawlee@3.18.2
          npm run build
          node --check tools/crawlee-acquisition-pilot.mjs
      - name: Compare identical 15-page acquisition budgets
        working-directory: Scrappers
        timeout-minutes: 18
        env:
          PI_CRAWLEE_SITE: ${{ matrix.site }}
          CRAWLEE_STORAGE_DIR: ./crawlee-pilot-tmp
        run: node tools/crawlee-acquisition-pilot.mjs
      - name: Upload raw source-backed A/B metrics even if trial fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawlee-acquisition-${{ matrix.site }}
          path: Scrappers/crawlee-pilot-results/
          retention-days: 14
          if-no-files-found: warn
