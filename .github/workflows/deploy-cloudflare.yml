name: Deploy Product Insights Workers to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "engine/pattern-systems/**"
      - "Scrappers/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-insights-cloudflare-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Test and deploy existing Workers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test Pattern Systems
        working-directory: engine/pattern-systems
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Test portable Scrappers
        working-directory: Scrappers
        run: |
          npm install --omit=optional --no-audit --no-fund
          npm test

      - name: Check whether Cloudflare deployment is configured
        id: credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CF_API_TOKEN" && -n "$CF_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare deployment: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
            echo "### Cloudflare deployment skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "Add both GitHub Actions repository secrets and run this workflow again." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy existing Pattern Systems Worker
        if: steps.credentials.outputs.ready == 'true'
        working-directory: engine/pattern-systems
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Deploy existing Scrappers Worker
        if: steps.credentials.outputs.ready == 'true'
        working-directory: Scrappers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
